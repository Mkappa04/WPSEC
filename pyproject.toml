[project]
name = "wpsec"
version = "4.0.0"
description = "Piattaforma multi-agente di Web Vulnerability Assessment (WordPress) con IA locale"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "lab"]
addopts = "-q"
markers = [
  "legacy: test di caratterizzazione del codice v3 (Pentest_ollama_v2.py)",
  "ollama: richiede Ollama reale in esecuzione (esclusi di default)",
]
